[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdm"
version = "0.1.0"
description = "Market data quality monitor"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["mdm"]

[tool.setuptools.package-data]
mdm = ["sql/*.sql", "config.yaml"]
