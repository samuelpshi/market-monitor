# Databricks Asset Bundle. Deploy with:
#   databricks bundle deploy -t dev
#   databricks bundle run market_data_monitor -t dev
# Secrets (scope "market-monitor"): alpha_vantage_api_key, anthropic_api_key, slack_webhook_url
#   databricks secrets create-scope market-monitor
#   databricks secrets put-secret market-monitor alpha_vantage_api_key
bundle:
  name: market-data-monitor

variables:
  notify_email:
    description: Where job-failure emails go
    default: samuelshi007@gmail.com
  post_digest:
    description: Post the digest to Slack (dev test runs default to no)
    default: "yes"
  namespace:
    description: Unity Catalog catalog.schema for the tables (Free Edition's catalog is "workspace")
    default: workspace.market_monitor

artifacts:
  mdm_wheel:
    type: whl
    build: uv build --wheel
    path: .

resources:
  jobs:
    market_data_monitor:
      name: market-data-monitor
      # 18:30 New York, weekdays: after the 16:00 close and Yahoo's end-of-day
      # settle. Holidays rerun the previous session idempotently; the digest
      # step will not repost a digest already sent for that session.
      schedule:
        quartz_cron_expression: "0 30 18 ? * MON-FRI"
        timezone_id: America/New_York
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      email_notifications:
        on_failure: ["${var.notify_email}"]
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              # pin to the numpy-1.x ABI the serverless image's pandas/pyarrow were built for
              - numpy<2
              - pandas>=2.1,<2.3
              - pyyaml
              - yfinance
              - exchange_calendars
              - anthropic
              - requests
              - ./dist/*.whl
      tasks:
        - task_key: ingest
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          spark_python_task:
            python_file: ./jobs/run_step.py
            parameters: ["--root", "${workspace.file_path}", "--step", "ingest", "--namespace", "${var.namespace}"]
        - task_key: quality
          depends_on: [{task_key: ingest}]
          environment_key: default
          spark_python_task:
            python_file: ./jobs/run_step.py
            parameters: ["--root", "${workspace.file_path}", "--step", "quality", "--namespace", "${var.namespace}"]
        - task_key: reconcile
          depends_on: [{task_key: ingest}]
          environment_key: default
          spark_python_task:
            python_file: ./jobs/run_step.py
            parameters: ["--root", "${workspace.file_path}", "--step", "reconcile", "--namespace", "${var.namespace}"]
        - task_key: anomalies
          # reads prices_clean, which depends on both quality and reconcile flags
          depends_on: [{task_key: quality}, {task_key: reconcile}]
          environment_key: default
          spark_python_task:
            python_file: ./jobs/run_step.py
            parameters: ["--root", "${workspace.file_path}", "--step", "anomalies", "--namespace", "${var.namespace}"]
        - task_key: digest
          depends_on: [{task_key: anomalies}]
          environment_key: default
          spark_python_task:
            python_file: ./jobs/run_step.py
            parameters: ["--root", "${workspace.file_path}", "--step", "digest", "--namespace", "${var.namespace}", "--post", "${var.post_digest}"]

targets:
  # dev: development mode prefixes names and PAUSES the schedule; use for test runs.
  dev:
    mode: development
    default: true
    variables:
      post_digest: "no"
    workspace:
      host: https://dbc-2c0ef95b-cd08.cloud.databricks.com
  # prod: schedule is live (weekdays 18:30 New York).
  prod:
    mode: production
    workspace:
      host: https://dbc-2c0ef95b-cd08.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
